site_name: Documentação Universi.me
extra_css:
  - assets/stylesheets/extra.css
theme:
  logo: assets/universime.png
  favicon: assets/favicon.svg
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    # - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.code.select
    - content.code.annotate
  language: pt
  palette:
    - scheme: universime_scheme
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Ativar Modo Noturno
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Desativar Modo Noturno  
      primary: grey
      accent: blue

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/universi-me

copyright: |
  &copy; 2025 <a href="https://dcx.universi.me/" target="_blank" rel="noopener">Universi.me</a>
